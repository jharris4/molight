[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "regular_virtual_light_only: behavior requires a regular Virtual Light's own schedule mode",
]

[tool.ruff]
# The floor's interpreter (HA 2026.1 needs 3.13), so 3.14-only syntax is caught.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # HA's entity APIs are typed **kwargs: Any (async_turn_on, ...)
    "ANN401", # any-type
    # Conflicts with the ruff formatter
    "COM812", # missing-trailing-comma
    "ISC001", # single-line-implicit-string-concatenation
    # Conflicting docstring conventions; we follow D211/D212
    "D203", # incorrect-blank-line-before-class
    "D213", # multi-line-summary-second-line
    # Boolean args/values are idiomatic in Home Assistant entity APIs
    "FBT001", # boolean-type-hint-positional-argument
    "FBT002", # boolean-default-value-positional-argument
    "FBT003", # boolean-positional-value-in-call
    # HA interface methods (async_turn_on(**kwargs), flow steps taking
    # user_input) must accept arguments they don't always use
    "ARG002", # unused-method-argument
    # Complexity metrics: HA setup/state-machine code trips these routinely
    "C901",    # complex-structure
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are how pytest works
    "ANN",     # test functions don't need type annotations
    "D",       # relaxed docstring style in tests
    "PLR2004", # magic values in assertions are fine
    "SLF001",  # tests may poke at private state
    "ARG001",  # fixtures often take unused arguments
    "FBT",     # boolean literals in test calls are fine
]
"tests/e2e/runner/**" = [
    "EM",      # assertion failures include the live response inline
    "PERF401", # log scan clarity matters more than a micro-optimization
    "S105",    # fixed credentials exist only in the disposable HA config
    "S310",    # the runner deliberately calls its configured HA URL
    "T201",    # phase progress is the runner's command-line interface
    "TC003",   # Callable is clearer beside the other runner imports
    "TRY003",  # detailed assertion messages are acceptance-test output
    "TRY300",  # polling loops read more clearly with an early return
]
"tests/e2e/testbed/**" = [
    "EM",      # service validation errors include the bad fixture value
    "TC",      # HA callback types stay beside their runtime platform imports
    "TRY003",  # detailed service errors make fixture failures actionable
]
"scripts/**" = [
    "T201", # print is fine in scripts
    "S",    # scripts run trusted local input
]

[tool.ruff.lint.isort]
combine-as-imports = true
