name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      # The Home Assistant bump workflow sets it on its PRs; see ha-bump.yml.
      pinned_only:
        description: Only the PR jobs, on the pinned Home Assistant
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Lane scripts pin their run directory here so failures can be uploaded.
  MOLIGHT_E2E_RUN_ROOT: ${{ github.workspace }}/.e2e-run

jobs:
  current:
    name: Live E2E (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.pinned_only
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the live acceptance suite
        run: npm run test:e2e:core
      - name: Make the retained run directory readable
        # A job that hits its timeout is cancelled, not failed.
        if: failure() || cancelled()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: molight-e2e-failure-core
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  restarts:
    name: Restart scenarios (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.pinned_only
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run the independent restart scenarios
        run: npm run test:e2e:restarts
      - name: Make the retained run directory readable
        if: failure() || cancelled()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: molight-e2e-failure-restarts
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  scenarios:
    name: Behavior scenarios ${{ matrix.shard }} (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.pinned_only
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@v7
      - name: Run behavior scenario shard ${{ matrix.shard }}
        run: npm run test:e2e:scenarios-${{ matrix.shard }}
      - name: Make the retained run directory readable
        if: failure() || cancelled()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: molight-e2e-failure-scenarios-${{ matrix.shard }}
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser smoke (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.pinned_only
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Playwright test package
        run: npm ci
      - name: Run the browser smoke tests
        run: npm run test:e2e:browser
      - name: Make the retained artifacts readable
        if: failure() || cancelled()
        run: |
          sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" tests/e2e/artifacts/browser 2>/dev/null || true
      - name: Upload browser failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: molight-browser-e2e-failure
          path: |
            ${{ env.MOLIGHT_E2E_RUN_ROOT }}
            tests/e2e/artifacts/browser
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  compatibility:
    name: Live E2E (${{ matrix.ref && format('{0}, ', matrix.ref) }}${{ matrix.ha.label }}, ${{ matrix.suite }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.pinned_only
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.ha.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Schedules run on main, so the nightly run also checks out develop to
        # catch a break on the floor release before it reaches a release.
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main", "develop"]') || fromJSON('[""]') }}
        suite: [core, restarts, scenarios-a, scenarios-b, scenarios-c, browser]
        ha:
          - label: HA floor
            slug: floor
            # The minimum release hacs.json declares; see tests/e2e/env.sh.
            image: floor
            experimental: false
          - label: HA current
            slug: current
            # Empty: the pinned image from tests/e2e/env.sh.
            image: ""
            experimental: false
          # Floating stable is an upstream canary: report incompatibilities
          # without blocking the known-good floor/current compatibility legs.
          - label: HA stable canary
            slug: stable
            image: ghcr.io/home-assistant/home-assistant:stable
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v7
        if: matrix.suite == 'browser'
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Playwright test package
        if: matrix.suite == 'browser'
        run: npm ci
      - name: Run the ${{ matrix.suite }} suite
        run: npm run test:e2e:${{ matrix.suite }}
        env:
          MOLIGHT_E2E_HA_IMAGE: ${{ matrix.ha.image }}
      - name: Make the retained artifacts readable
        if: failure() || cancelled()
        run: |
          sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" tests/e2e/artifacts/browser 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: molight-e2e-failure-${{ matrix.ref || 'dispatch' }}-${{ matrix.ha.slug }}-${{ matrix.suite }}
          path: |
            ${{ env.MOLIGHT_E2E_RUN_ROOT }}
            tests/e2e/artifacts/browser
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
