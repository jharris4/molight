name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Lane scripts pin their run directory here so failures can be uploaded.
  MOLIGHT_E2E_RUN_ROOT: ${{ github.workspace }}/.e2e-run

jobs:
  current:
    name: Live E2E (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run the live acceptance suite
        run: npm run test:e2e:core
        env:
          MOLIGHT_E2E_HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.8.0
      - name: Make the retained run directory readable
        if: failure()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molight-e2e-failure-core
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  restarts:
    name: Restart scenarios (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run the independent restart scenarios
        run: npm run test:e2e:restarts
        env:
          MOLIGHT_E2E_HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.8.0
      - name: Make the retained run directory readable
        if: failure()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molight-e2e-failure-restarts
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  scenarios:
    name: Behaviour scenarios ${{ matrix.shard }} (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@v5
      - name: Run behaviour scenario shard ${{ matrix.shard }}
        run: npm run test:e2e:scenarios-${{ matrix.shard }}
        env:
          MOLIGHT_E2E_HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.8.0
      - name: Make the retained run directory readable
        if: failure()
        run: sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molight-e2e-failure-scenarios-${{ matrix.shard }}
          path: ${{ env.MOLIGHT_E2E_RUN_ROOT }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser smoke (HA current)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Playwright test package
        run: npm ci
      - name: Run the browser smoke tests
        run: npm run test:e2e:browser
        env:
          MOLIGHT_E2E_HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.8.0
      - name: Make the retained artifacts readable
        if: failure()
        run: sudo chmod -R a+rX tests/e2e/artifacts/browser || true
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molight-browser-e2e-failure
          path: tests/e2e/artifacts/browser
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  compatibility:
    name: Live E2E (${{ matrix.ha.label }}, ${{ matrix.suite }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.ha.experimental }}
    strategy:
      fail-fast: false
      matrix:
        suite: [core, restarts, scenarios-a, scenarios-b, scenarios-c, browser, upgrade]
        ha:
          - label: HA floor
            slug: floor
            image: ghcr.io/home-assistant/home-assistant:2026.1.0
            experimental: false
          - label: HA current
            slug: current
            image: ghcr.io/home-assistant/home-assistant:2026.8.0
            experimental: false
          # Floating stable is an upstream canary: report incompatibilities
          # without blocking the known-good floor/current compatibility legs.
          - label: HA stable canary
            slug: stable
            image: ghcr.io/home-assistant/home-assistant:stable
            experimental: true
    steps:
      - uses: actions/checkout@v5
        with:
          # The upgrade suite needs the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: matrix.suite == 'browser'
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned Playwright test package
        if: matrix.suite == 'browser'
        run: npm ci
      - name: Run the ${{ matrix.suite }} suite
        run: npm run test:e2e:${{ matrix.suite }}
        env:
          MOLIGHT_E2E_HA_IMAGE: ${{ matrix.ha.image }}
      - name: Make the retained artifacts readable
        if: failure()
        run: |
          sudo chmod -R a+rX "$MOLIGHT_E2E_RUN_ROOT" tests/e2e/artifacts/browser 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: molight-e2e-failure-${{ matrix.ha.slug }}-${{ matrix.suite }}
          path: |
            ${{ env.MOLIGHT_E2E_RUN_ROOT }}
            tests/e2e/artifacts/browser
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
