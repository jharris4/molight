name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  # Release tags run this too; see release.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master on 2026-09-30

  hacs:
    name: HACS
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main on 2026-09-30
        with:
          category: integration
