version: 2

# Read from main, but the PRs land on develop and reach main with a release.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Each release pins one Home Assistant; ha-bump.yml moves it with the e2e image.
    ignore:
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: pytest-homeassistant
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
