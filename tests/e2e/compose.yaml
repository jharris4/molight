services:
  homeassistant:
    image: ${MOLIGHT_E2E_HA_IMAGE:-ghcr.io/home-assistant/home-assistant:2026.8.0}
    restart: unless-stopped
    # Optional CPU cap (e.g. 0.5) to approximate slow hardware such as a CI
    # runner; 0 leaves the container unlimited.
    cpus: ${MOLIGHT_E2E_HA_CPUS:-0}
    volumes:
      - ${MOLIGHT_E2E_CONFIG_DIR:?set by scripts/e2e}:/config
      - ${MOLIGHT_E2E_INTEGRATION_DIR:-../../custom_components/molight}:/config/custom_components/molight:ro
      - ./testbed/molight_testbed:/config/custom_components/molight_testbed:ro

  runner:
    image: python:3.14-slim
    working_dir: /e2e
    environment:
      MOLIGHT_E2E_HA_URL: http://homeassistant:8123
    volumes:
      - ./runner:/e2e:ro
      - ${MOLIGHT_E2E_CONFIG_DIR:?set by scripts/e2e}:/ha-config
    depends_on:
      - homeassistant

  browser:
    image: mcr.microsoft.com/playwright:v${MOLIGHT_E2E_PLAYWRIGHT_VERSION:?set by tests/e2e/env.sh from package.json}-noble
    init: true
    ipc: host
    working_dir: /workspace
    environment:
      CI: "true"
      MOLIGHT_BROWSER_HA_URL: http://homeassistant:8123
      MOLIGHT_BROWSER_ARTIFACT_DIR: /artifacts
    volumes:
      - ../..:/workspace:ro
      - ${MOLIGHT_E2E_BROWSER_ARTIFACT_DIR:-./artifacts/browser}:/artifacts
    depends_on:
      - homeassistant
