set_state:
  name: Set simulated state
  description: Set the persisted state and attributes of a testbed entity.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity: {}
    state:
      name: State
      required: true
      selector:
        text: {}
    attributes:
      name: Attributes
      selector:
        object: {}

set_available:
  name: Set simulated availability
  description: Make a testbed entity available or unavailable.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity: {}
    available:
      name: Available
      required: true
      selector:
        boolean: {}

fire_event:
  name: Fire simulated event
  description: Emit an event from a testbed event entity.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain: event
    event_type:
      name: Event type
      required: true
      selector:
        text: {}
    attributes:
      name: Attributes
      selector:
        object: {}

set_behavior:
  name: Set simulated reporting behavior
  description: Change how a testbed light reports back after commands.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain: light
    behavior:
      name: Behavior
      description: Any of latency, report_steps, transition_steps, brightness_levels, xy_color.
      required: true
      selector:
        object: {}

set_startup_delay:
  name: Delay an entity at the next startup
  description: Add a testbed binary sensor only this many seconds after the next boot, like a slow source integration. One-shot.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain: binary_sensor
    seconds:
      name: Seconds
      required: true
      selector:
        number:
          min: 0
          max: 300
